[package]
name = "app"
version = "0.1.0"
description = "Desktop build of the EDID / CEA-861 / DisplayID viewer and editor"
authors = ["PikaJian"]
license = "MIT"
repository = "https://github.com/PikaJian/edid-editor-vue"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
io-kit-sys = "0.4"
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation"] }
# COM/WMI, for the E-EDID blocks the registry does not cache. windows-sys has no
# COM support; this version is already in the tree via tauri.
windows = { version = "0.61", features = [
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Rpc",
  "Win32_System_Variant",
  "Win32_System_Wmi",
] }
winreg = "0.52"
