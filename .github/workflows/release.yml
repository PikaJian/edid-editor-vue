name: Release

# Push a tag like v0.1.0 to build the desktop app on macOS + Windows and attach
# the installers to a GitHub release. Run manually (workflow_dispatch) to build
# without releasing — the bundles are uploaded as workflow artifacts instead.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # One universal (Intel + Apple Silicon) .dmg. Narrowed from the
          # config's `targets: "all"`, which also emits the updater-format
          # .app.tar.gz — dead weight on a release with no updater configured.
          # The .app is still built, since the .dmg is made from it.
          - platform: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundles: --bundles dmg
          # .msi + NSIS .exe installer
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: x86_64-pc-windows-msvc
            bundles: ''

    runs-on: ${{ matrix.platform }}

    steps:
      # Full history and tags: the release notes are built from the commit range
      # between this tag and the previous one.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          conf_version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$conf_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match src-tauri/tauri.conf.json version $conf_version — bump the config before tagging, or the release will ship an app reporting the wrong version."
            exit 1
          fi

      # Both matrix jobs compute this, and both pass it to tauri-action — whichever
      # creates the release wins, and they agree, so there is nothing to race over.
      - name: Build release notes
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          # actions/checkout resolves the ref to a commit SHA and recreates the tag
          # locally as a lightweight ref, which drops the annotation. Refetch the
          # real tag object, or the message below is silently the commit's instead.
          git fetch --force --no-tags origin "refs/tags/$tag:refs/tags/$tag"
          # Nearest tag reachable before this one; empty for the first release.
          previous=$(git describe --tags --abbrev=0 "$tag^" 2>/dev/null || true)
          {
            echo 'body<<RELEASE_NOTES_EOF'
            # The annotated tag message — the human summary of the release.
            # `%(contents)`, not `%(contents:body)`: git treats a tag message's
            # first line as its subject and `body` omits it, which silently ate
            # the one-sentence summary out of v0.1.2's notes. `%(contents)` is
            # the message verbatim. It would also carry the PGP block on a
            # signed tag, which nothing here produces.
            # Guarded because on a lightweight tag this falls through to the
            # commit message, which is not release notes.
            if [ "$(git cat-file -t "$tag")" = tag ]; then
              git tag -l --format='%(contents)' "$tag"
            fi
            echo '### Changes'
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "$previous..$tag"
              echo
              echo "**Full changelog**: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/compare/$previous...$tag"
            else
              git log --no-merges --pretty='- %s' "$tag"
            fi
            echo
            cat .github/release-notes-footer.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      - run: npm ci

      # tauri.conf.json's beforeBuildCommand is `npm run build`, which has no
      # prebuild hook, so the edidts workspace package must be built first or
      # the frontend build fails on an unresolved `edidts` import. See CLAUDE.md.
      - name: Build edidts
        run: npm run build --workspace=edidts

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Empty tagName => build only, no release (workflow_dispatch runs).
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: EDID Editor ${{ github.ref_name }}
          # Annotated tag message + commit changelog + .github/release-notes-footer.md
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.target }} ${{ matrix.bundles }}

      - name: Upload bundles as artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: edid-editor-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          if-no-files-found: error
